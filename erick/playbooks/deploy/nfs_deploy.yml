# =============================================================================
# Configuración NFS Cliente en Deploy
# =============================================================================
---
- name: "Configuración NFS Cliente {{ target }}"
  hosts: '{{ target }}'
  become: true
  gather_facts: yes

  tasks:
    - name: "Instalando nfs-common"
      package:
        name: nfs-common
        state: present
    - name: "Crear punto de montaje para backups NFS"
      file:
        path: "{{ directories.nfs_mount }}"
        state: directory
        owner: "{{ system_users.app_admin }}"
        group: www-data
        mode: '0755'

    - name: "Configurar montaje NFS en /etc/fstab"
      blockinfile:
        path: /etc/fstab
        marker: "# {mark} ANSIBLE MANAGED NFS MOUNT"
        block: |
          # Montaje NFS para backups desde master
          {{ master_server.ip_internal }}:{{ nfs.export_path }} {{ directories.nfs_mount }} nfs defaults,auto,rw,user 0 0

    - name: "Probar montaje NFS"
      mount:
        path: "{{ directories.nfs_mount }}"
        src: "{{ master_server.ip_internal }}:{{ nfs.export_path }}"
        fstype: nfs
        opts: defaults,auto,rw,user
        state: mounted

    - name: "Verificar acceso de escritura NFS"
      file:
        path: "{{ directories.nfs_mount }}/test_deploy_access"
        state: touch
        owner: "{{ system_users.app_admin }}"
        group: www-data
        mode: '0644'
      register: nfs_test

    - name: "Eliminar archivo de prueba NFS"
      file:
        path: "{{ directories.nfs_mount }}/test_deploy_access"
        state: absent
      when: nfs_test is succeeded

