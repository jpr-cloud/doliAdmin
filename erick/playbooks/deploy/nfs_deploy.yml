# =============================================================================
# Configuración NFS Cliente en Deploy
# =============================================================================
---
- name: "Configuración NFS Cliente"
  hosts: '{{ target }}'
  become: true
  gather_facts: yes

  vars:
    nfs_server_ip: "{{ master_server.ip }}"  # Debe estar definida en variables
    nfs_share_path: "/home/admin/wwwroot/dolibarr_documents/sellyoursaas"
    nfs_mount_point: "/home/admin/wwwroot/dolibarr_documents/sellyoursaas"

  tasks:
    - name: "Instalar nfs-common (cliente NFS)"
      apt:
        name: nfs-common
        state: present

    - name: "Crear punto de montaje para NFS"
      file:
        path: "{{ nfs_mount_point }}"
        state: directory
        owner: "{{ system_users.admin }}"
        group: "{{ system_users.admin }}"
        mode: '0755'

    - name: "Montar recurso NFS manualmente (prueba)"
      mount:
        path: "{{ nfs_mount_point }}"
        src: "{{ nfs_server_ip }}:{{ nfs_share_path }}"
        fstype: nfs
        state: mounted
        opts: defaults

    - name: "Desmontar recurso NFS (prueba)"
      mount:
        path: "{{ nfs_mount_point }}"
        state: unmounted

    - name: "Agregar recurso NFS a /etc/fstab para montaje automático"
      mount:
        path: "{{ nfs_mount_point }}"
        src: "{{ nfs_server_ip }}:{{ nfs_share_path }}"
        fstype: nfs
        opts: defaults
        state: present

    - name: "Montar todos los recursos de /etc/fstab (mount -a)"
      command: mount -a
      register: mount_a_result
      changed_when: false

    - name: "Verificar montaje NFS"
      command: mount | grep "{{ nfs_mount_point }}"
      register: nfs_mount_check
      changed_when: false

    - name: "Mostrar resultado del montaje NFS"
      debug:
        var: nfs_mount_check.stdout
