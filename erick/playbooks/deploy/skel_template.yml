# =============================================================================
# Creación o modificación de la plantilla /etc/skel para SSH y MySQL
# =============================================================================
# Las rutas de las claves públicas están fijas y deben ser cambiadas por variables en producción.
---
- name: 'Creación o modificación de /etc/skel para SSH y MySQL'
  hosts: '{{ target }}'
  become: true
  gather_facts: yes

  vars:
    myunixlogin_pubkey_path: "/home/myunixlogin/.ssh/id_rsa.pub"  # Cambiar por variable
    master_admin_pubkey_path: "/root/admin_master_id_rsa.pub"      # Cambiar por variable

  tasks:
    - name: 'Crear directorio .ssh en /etc/skel'
      file:
        path: /etc/skel/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: 'Crear archivo authorized_keys_support en /etc/skel/.ssh'
      file:
        path: /etc/skel/.ssh/authorized_keys_support
        state: touch
        owner: root
        group: root
        mode: '0600'

    - name: 'Agregar clave pública de myunixlogin a authorized_keys_support'
      lineinfile:
        path: /etc/skel/.ssh/authorized_keys_support
        line: "{{ lookup('file', myunixlogin_pubkey_path) }}"
        create: yes
        state: present

    - name: 'Agregar clave pública de admin del master a authorized_keys_support'
      lineinfile:
        path: /etc/skel/.ssh/authorized_keys_support
        line: "{{ lookup('file', master_admin_pubkey_path) }}"
        create: yes
        state: present

    - name: 'Asegurar permisos correctos en /etc/skel/.ssh'
      file:
        path: /etc/skel/.ssh
        state: directory
        mode: '0700'
        recurse: yes

    - name: 'Crear archivo .my.cnf en /etc/skel'
      copy:
        dest: /etc/skel/.my.cnf
        content: |
          [client]
          protocol=tcp
        owner: root
        group: root
        mode: '0644'
