# =============================================================================
# Configuracion de politica de contraseñas
# =============================================================================
# Este playbook configura la longitud minima de contraseña en {{ password_policy.min_length }} caracteres
# editando el archivo /etc/pam.d/common-password
# =============================================================================
---
- name: "Configuracion de politica de contraseñas"
  hosts: "{{ target }}"
  become: true
  gather_facts: yes
  vars:
    min_password_length: "{{ password_policy.min_length }}"

  tasks:
    # =============================================================================
    # VERIFICACION DE CONFIGURACION ACTUAL
    # =============================================================================
    - name: "Verificar configuracion PAM actual"
      shell: "grep -n 'pam_unix.so' /etc/pam.d/common-password"
      register: current_pam_config
      changed_when: false
      ignore_errors: yes

    - name: "Mostrar configuracion PAM actual"
      debug:
        msg:
          - "=== CONFIGURACION PAM ACTUAL ==="
          - "{{ current_pam_config.stdout_lines | default(['No se encontro configuracion pam_unix.so']) }}"
          - "================================"

    - name: "Crear backup del archivo original"
      copy:
        src: /etc/pam.d/common-password
        dest: /etc/pam.d/common-password.backup
        remote_src: yes
        backup: yes

    # =============================================================================
    # CONFIGURAR LONGITUD MINIMA DE CONTRASEÑA
    # =============================================================================
    - name: "Configurar longitud minima de contraseña ({{ min_password_length }} caracteres)"
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+\[success=1 default=ignore\]\s+pam_unix\.so.*'
        line: 'password        [success=1 default=ignore]      pam_unix.so obscure sha512 minlength={{ min_password_length }}'
        backup: yes

    - name: "Configurar configuracion alternativa si existe otro formato"
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+requisite\s+pam_unix\.so.*'
        line: 'password        requisite                       pam_unix.so obscure sha512 minlength={{ min_password_length }}'
        backup: yes

    - name: "Configurar configuracion para formato sufficient"
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password\s+sufficient\s+pam_unix\.so.*'
        line: 'password        sufficient                      pam_unix.so obscure sha512 minlength={{ min_password_length }}'
        backup: yes

    # =============================================================================
    # VERIFICACIONES POST-CONFIGURACION
    # =============================================================================
    - name: "Verificar configuracion PAM despues del cambio"
      shell: "grep 'minlength' /etc/pam.d/common-password"
      register: pam_minlength_check
      changed_when: false
      ignore_errors: yes

    - name: "Mostrar configuracion de minlength"
      debug:
        msg:
          - "=== CONFIGURACION MINLENGTH ==="
          - "{{ pam_minlength_check.stdout_lines | default(['No se encontro minlength configurado']) }}"
          - "==============================="

    - name: "Verificar archivo completo PAM (sin comentarios)"
      shell: "cat /etc/pam.d/common-password | grep -v '^#' | grep -v '^$'"
      register: full_pam_config
      changed_when: false

    - name: "Mostrar configuracion PAM completa"
      debug:
        msg:
          - "=== CONFIGURACION PAM COMPLETA ==="
          - "{{ full_pam_config.stdout_lines }}"
          - "=================================="

    # =============================================================================
    # CONFIGURACION ADICIONAL EN LOGIN.DEFS
    # =============================================================================
    - name: "Configurar longitud minima en /etc/login.defs"
      lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MIN_LEN'
        line: 'PASS_MIN_LEN    {{ min_password_length }}'
        backup: yes

    - name: "Verificar configuracion en login.defs"
      shell: "grep 'PASS_MIN_LEN' /etc/login.defs"
      register: login_defs_check
      changed_when: false

    - name: "Mostrar configuracion login.defs"
      debug:
        msg: "{{ login_defs_check.stdout_lines }}"

