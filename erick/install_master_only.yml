# =============================================================================
# VERIFICACIÓN MASTER
# =============================================================================
- name: "FASE 3: Verificación instalación Master"
  hosts: master
  become: true
  gather_facts: yes
  tasks:
    - name: "Verificar servicios críticos en Master"
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - apache2
        - mariadb
        - fail2ban
        - nfs-kernel-server

    - name: "Verificar acceso a directorios críticos"
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ directories.wwwroot }}"
        - "{{ directories.backups }}"
        - "{{ directories.scripts }}"
      check_mode: yes

    - name: "Mostrar resumen de instalación Master"
      debug:
        msg:
          - "=========================================="
          - "INSTALACIÓN MASTER COMPLETADA"
          - "Servidor: {{ inventory_hostname }}"
          - "IP: {{ ansible_host }}"
          - "Hostname: {{ ansible_hostname }}"
          - "=========================================="

# =============================================================================
# CONFIGURACIONES ADICIONALES COMPLETENESS
# =============================================================================
- name: "FASE 14: Políticas de contraseñas"
  import_playbook: playbooks/shared/min_password.yml
