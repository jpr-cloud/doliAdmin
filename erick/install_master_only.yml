# Creation of working directories
# =============================================================================
- name: Creación de los directorios de trabajo
  import_playbook: playbooks/shared/working_directories.yml
  vars:
    target: master
    scope: master

# =============================================================================
# Getting files of Dolibarr and SellYourSaas application
# =============================================================================
- name: "[Getting files of Dolibarr and SellYourSaas application]: Instalación Dolibarr en Master"
  import_playbook: playbooks/shared/getDolibarr.yml
  vars:
    target: master
# =============================================================================
# Creation of /.conf with credentials
# =============================================================================

- name: "FASE 2.1: Creación de /conf con credenciales"
  import_playbook: playbooks/shared/confWithCredentials.yml
  vars:
    target: master
    scope: master

# =============================================================================
# Installing the nfs share
# =============================================================================

- name: "FASE 2.2: Configuración NFS Server en Master"
  import_playbook: playbooks/master/nfs_master.yml
  vars:
    target: master
    internal_dest_ip: "{{ deployment_server.ip_internal }}"

