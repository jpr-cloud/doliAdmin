# =============================================================================
# INSTALACIÓN SOLO SERVIDOR MASTER
# =============================================================================
# Este playbook instala únicamente el servidor master de SellYourSaas
# =============================================================================
---
- name: "=== INSTALACIÓN SOLO MASTER SERVER ==="
  hosts: master
  gather_facts: yes
  tasks:


# =============================================================================
# CONFIGURACIÓN DE HOSTNAME MASTER
# =============================================================================
- name: "Configuración de hostname Master"
  hosts: master
  become: true
  tasks:
    - name: "Configurar hostname del servidor Master"
      include_tasks: playbooks/shared/sethostname_tasks.yml
      vars:
        target: "{{ target }}"

# =============================================================================
# CONFIGURACIÓN BÁSICA MASTER
# =============================================================================
- name: "FASE 1: Instalación de paquetes comunes en Master"
  import_playbook: playbooks/shared/common_packages.yml
  vars:
    target: master

# =============================================================================
# 'Unix personal sysadmin account': Creación del usuario Unix Personal Sysadmin 
# =============================================================================
- name: "Creación del usuario Unix Personal Sysadmin"
  import_playbook: playbooks/shared/UnixPersonalSysadminAccount.yml
  vars:
    target: master

# =============================================================================
# 'Unix admin account':Creación del usuario admin y directorios de trabajo
# Esta tarea solo es para deployment, se comenta por
# =============================================================================
- name: "Creación del usuario admin y directorios de trabajo"
  import_playbook: playbooks/shared/UnixAdminAccount.yml
  vars:
    target: master

# =============================================================================
# 'SSH setup' Solo para deployment, no para master
# =============================================================================
