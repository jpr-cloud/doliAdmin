# =============================================================================
# INSTALACIÓN SOLO SERVIDOR MASTER
# =============================================================================
# Este playbook instala únicamente el servidor master de SellYourSaas
# =============================================================================
---
- name: "=== INSTALACIÓN para {{ target }} ==="
  hosts: '{{ target }}'
  gather_facts: yes
  tasks:

# =============================================================================
# Choice a Hostname for the server(s) and set it
# =============================================================================
- name: "Configuración de hostname {{ target }}"
  hosts: '{{ target }}'
  become: true
  tasks:
    - name: "Configurar hostname del servidor {{ target }}"
      include_tasks: playbooks/shared/sethostname_tasks.yml
      vars:
        target: "{{ target }}"
    - name: Configurando /etc/sysctl.conf
      blockinfile:
        path: /etc/sysctl.conf
        block: |
          vm.vfs_cache_pressure=50
        marker: "# {mark} ANSIBLE MANAGED BLOCK manager and managed nodes"

# =============================================================================
# Instalación de paquetes comunes
# =============================================================================
- name: "Instalación de paquetes comunes"
  import_playbook: playbooks/shared/common_packages.yml
  vars:
    target: '{{ target }}'

# =============================================================================
# Login setup
# =============================================================================
# Login setup
#    Default shell
# =============================================================================
- name: "Modify the default shell to use bash"
  import_playbook: playbooks/shared/default_shell.yml
  vars:
    default_shell_path: "/bin/bash"
    default_sh_link: "/bin/sh"
    target: "{{ target }}"

# =============================================================================
# Login setup
#    Min for password
# =============================================================================
- name: "Min for password"
  import_playbook: playbooks/shared/min_password.yml
  vars:
    target: '{{ target }}'

# =============================================================================
# Login setup
#    Unix personal sysadmin account
# =============================================================================

- name: "Login setup::Unix personal sysadmin account"
  import_playbook: playbooks/shared/UnixPersonalSysadminAccount.yml
  vars:
    target: '{{ target }}'

# TODO: Falta Add your SSH public key to be able to login using your RSA/DSA key

# =============================================================================
# Unix admin account
# Esta tarea sólo es para deploy
# =============================================================================
- name: "Creación del usuario admin y directorios de trabajo"
  import_playbook: playbooks/shared/UnixAdminAccount.yml
  vars:
    target: '{{ target }}'
# =============================================================================
# SSH setup
# =============================================================================
#- name: "SSH setup"
#  import_playbook: playbooks/deploy/ssh_sudo.yml
#  vars:
#    target: '{{ target }}'
# =============================================================================
# Deletion of information files at login
# =============================================================================
- name: "Borrado de archivos de información al login"
  import_playbook: playbooks/deploy/delete_info_files.yml
  vars:
    target: '{{ target }}'

# =============================================================================
# Creation or modification of /etc/skel directory template
# =============================================================================
- name: "reation or modification of /etc/skel directory template"
  import_playbook: playbooks/deploy/skel_template.yml
  vars:
    target: '{{ target }}'

# =============================================================================
# Add alias
# =============================================================================
- name: "Add alias to .bashrc"
  import_playbook: playbooks/deploy/add_alias.yml
  vars:
    target: '{{ target }}'

# TODO: [NO] Added support for IP v6 (optional, if ipv6 wanted but not yet enabled)
# TODO: [NO[ No hace falta: Addition of a swap (optional), Estamos usando SSD y no es necesario
