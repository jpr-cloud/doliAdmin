# =============================================================================
# Creation of working directories
# =============================================================================
- name: "Creación de directorios de trabajo"
  import_playbook: playbooks/shared/working_directories.yml
  vars:
    target: '{{ target }}'
    scope: deploy  # Define the scope of the playbook as deploy

# =============================================================================
# Instalación de paquetes comunes
# =============================================================================
- name: "Instalación de paquetes comunes"
  import_playbook: playbooks/shared/common_packages.yml
  vars:
    target: '{{ target }}'

# =============================================================================
# Getting files of Dolibarr and SellYourSaas application
